services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DATABASE_URL: postgres://rag_user:rag_password@postgres:5432/rag_chat
      HOST: 0.0.0.0
      PORT: 4000
      OLLAMA_EMBED_HOST: http://host.docker.internal:11434
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
